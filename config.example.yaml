# Clanker Token Tracker — example configuration
# Copy to config.yaml and fill in your values.
# Environment variables override: CLANKER_API_KEY, TELEGRAM_BOT_TOKEN,
# TELEGRAM_CHAT_ID, DATABASE_URL, BASE_RPC_WS

database:
  # PostgreSQL (recommended for production 24/7 operation)
  url: "postgresql+asyncpg://clanker:clanker@localhost:5432/clanker_tracker"
  echo: false
  pool_size: 10               # Connection pool size
  max_overflow: 20            # Extra connections beyond pool_size
  pool_recycle: 3600          # Recycle stale connections (seconds)

clanker:
  base_url: "https://www.clanker.world/api"
  poll_interval_seconds: 30
  champagne_poll_interval_seconds: 120   # Curated champagne tokens scan
  api_key: null            # x-api-key for authenticated endpoints
  page_size: 50

bankr:
  deployer_addresses:
    # Add known Bankr deployer wallet addresses here (lowercase)
    # - "0x1234..."
  sdk_endpoint: null
  micropayment_amount_usd: 0.10

dexscreener:
  base_url: "https://api.dexscreener.com/latest/dex"
  rate_limit_per_minute: 60
  batch_size: 30             # Max addresses per batch request (DexScreener cap)

base_rpc:
  http_url: "https://mainnet.base.org"
  ws_url: null             # wss://... for real-time TokenCreated events

filtering:
  # ── Pre-filter (fast, before any API calls) ──────────
  skip_bankr: true                    # Reject Bankr bot launches instantly
  require_social_links: false         # Require at least one social link
  champagne_auto_pass_stage1: true    # Champagne tokens skip Stage 1

  # ── Stage 1: Instant reject gate ─────────────────────
  scam_keywords:
    - rug
    - scam
    - honeypot
    - honey pot
    - ponzi
    - fake
    - drain

  # ── Stage 2: DEX metrics thresholds ──────────────────
  min_pool_liquidity_usd: 3000          # Raised from 1K — too many dead tokens
  min_mcap_usd: 1000
  min_volume_1h_usd: 500                # Raised from 50 — need real volume
  min_volume_5m_usd: 100
  min_holders: 5
  min_buy_sell_ratio: 0.3

  # ── Bot-buy spray detection ───────────────────────────
  # Tokens with hundreds of tiny buys are bot-inflated trash.
  # If buys_1h > threshold AND avg buy < max, flag as bot.
  bot_buy_threshold: 250                # Trigger bot check above this many buys
  bot_avg_buy_max_usd: 100              # Avg buy size below $100 = bot spray

  # ── Stage 3: Momentum detection ──────────────────────
  min_buys_1h: 10                       # Minimum buy txns in last hour
  price_surge_threshold_pct: 20         # % price jump = hot signal

  # ── Stage 4: Smart money ─────────────────────────────
  smart_money_wallet_file: "data/smart_money_wallets.txt"

  # ── Stage 5: Context quality ─────────────────────────
  require_origin_url: false

  # ── Scoring weights ─────────────────────────────────
  # Data-driven rebalance (Feb 2026 analysis of 88 alerts):
  # - Metrics raised (2.0): liquidity + volume are real survival signals
  # - Context lowered (0.3): social links alone don't predict success
  # - Firehose penalty (0.70): firehose has 0% win rate historically
  weight_metrics: 2.0                  # Primary signal (was 1.0)
  weight_momentum: 1.5
  weight_smart_money: 2.0
  weight_context: 0.3                  # Social links not predictive (was 1.0)
  weight_champagne_bonus: 0.15         # Additive bonus for champagne tokens
  firehose_score_penalty: 0.70         # Multiply firehose scores by this

  score_threshold: 0.45                # Minimum to trigger alert (lowered — bot detection makes scores honest)
  min_alert_mcap_usd: 50000            # Hard MCap floor
  min_alert_liquidity_usd: 5000        # Hard liquidity floor at alert time
  duplicate_symbol_cooldown_seconds: 7200  # Don't alert same symbol within 2h
  recheck_delay_seconds: 300           # Wait before DEX lookup (index time)

  # ── Firehose scoring skip ────────────────────────────
  # Firehose has 0% historical gem rate. Skip scoring entirely
  # and only use it for token ingestion into the database.
  skip_firehose_scoring: true          # Skip firehose tokens in eval pipeline

  # ── Champagne-specific threshold ─────────────────────
  # Lower alert threshold for champagne tokens (curated, 58% liq rate)
  champagne_score_threshold: 0.30      # vs 0.45 for normal tokens

  # ── Wash-trading penalty ─────────────────────────────
  # Penalize tokens with suspicious volume patterns
  # (high volume / low liquidity + many tiny buys)
  wash_vol_liq_ratio: 2.0             # vol_1h / liquidity ratio trigger
  wash_min_buys: 200                   # Min buys to flag wash trading
  wash_score_multiplier: 0.50          # Multiply score by this when flagged

# ── Breakout Scanner — delayed mover detection ───────────
# Finds tokens that launched days ago but are NOW gaining momentum.
# Uses DexScreener trending/boosted/profiles endpoints to detect tokens
# the firehose missed (e.g. $SEVEN: launched 5 days ago, then +412%).
breakout:
  enabled: true
  poll_interval_seconds: 180           # How often to scan (3 min default)
  min_liquidity_usd: 10000             # Min liquidity for breakout candidate
  min_volume_24h_usd: 5000             # Min 24h volume
  min_buys_1h: 20                      # Min buy txns in last hour
  min_price_change_1h_pct: 50          # Min 1h price change % (OR with buys)
  max_age_days: 14                     # Ignore tokens older than 2 weeks
  breakout_score_bonus: 0.05           # Flat bonus added to weighted score (reduced from 0.10)
  rescan_cooldown_seconds: 3600        # Don't re-check same token within 1h

# ── Backfill — catch recent tokens on first startup ──────
# On first run (empty DB), pages backward through Clanker API
# to discover tokens from the last N hours. Prevents missing
# launches that happened before the bot started.
backfill:
  enabled: true
  hours: 12                            # How many hours back to scan
  max_pages: 200                       # Safety cap (10 tokens/page)

# ── Gainers Scanner — DexScreener search + community takeovers ──
# Actively searches DexScreener for high-momentum Base tokens using
# rotating keywords and community takeover feeds. Catches tokens that
# the firehose and breakout scanner missed (e.g. organic trending).
gainers:
  enabled: true
  poll_interval_seconds: 120           # How often to search (2 min default)
  search_keywords:                     # Rotated 2 per cycle
    - "clanker"
    - "base meme"
    - "base agent"
    - "farcaster token"
    - "base degen"
    - "onchain ai"
    - "base community"
  min_liquidity_usd: 5000             # Min liquidity for gainers candidate
  min_volume_1h_usd: 1000             # Min 1h volume (USD)
  min_buys_1h: 10                      # Min buy txns in last hour
  min_price_change_1h_pct: 20          # Min 1h price change %
  max_age_days: 7                      # Ignore tokens older than 1 week
  gainer_score_bonus: 0.05             # Flat bonus added to weighted score
  rescan_cooldown_seconds: 1800        # Don't re-check same token within 30 min

# ── PID Feedback Loop — self-improving alert quality ─────
# Re-checks alerted tokens at 1h/6h/24h to classify outcomes.
# Uses a PID-style controller to auto-adjust score_threshold
# based on the rolling gem/dead ratio.
pid:
  enabled: true
  check_interval_seconds: 300          # How often to run outcome checks (5 min)
  check_windows:                       # Re-check at these intervals after alert
    - 3600                             # 1 hour
    - 21600                            # 6 hours
    - 86400                            # 24 hours
  check_tolerance_seconds: 600         # ±10 min tolerance for check windows

  # Outcome classification
  gem_mcap_multiplier: 2.0             # MCap must 2x to be classified 'gem'
  dead_liq_threshold_usd: 500          # Liquidity below $500 = 'dead'

  # Auto-tune (PID controller)
  auto_tune_enabled: true
  target_gem_rate: 0.25                # Target: 25% of alerts should be gems
  threshold_adjust_step: 0.005         # Adjust by 0.005 per cycle (was 0.01; prevents runaway)
  threshold_min: 0.40                  # Never go below this threshold
  threshold_max: 0.60                  # Never go above this (hard ceiling, was 0.75)
  lookback_hours: 48                   # Rolling window for outcome ratio
  min_samples: 50                      # Need 50+ classified outcomes before tuning (was 10)
  no_alert_decay_hours: 6              # Dead-man's switch: auto-lower threshold if no alerts for 6h

# ── Arkham Intel — Smart Wallet Tracking ──────────────────
# Integrates with Arkham Intel API to discover and monitor
# profitable wallets tagged 'fomo-user' on Base chain.
# Generates alerts when tracked wallets buy new tokens,
# and conviction signals when they buy tokens in our DB.
arkham:
  enabled: false                       # Set to true once API key is configured
  api_key: null                        # or set ARKHAM_API_KEY env var
  base_url: "https://api.arkm.com"
  tag_id: "fomo-user"                  # Arkham tag for wallet discovery

  # Wallet sync settings
  wallet_sync_interval_seconds: 3600   # Re-sync wallet performance (1h)
  max_wallets: 200                     # Cap on tracked wallets

  # Profitability thresholds (PnL % to qualify as profitable)
  min_profit_pct_1d: 5.0               # Min 1-day PnL %
  min_profit_pct_7d: 10.0              # Min 7-day PnL %
  min_profit_pct_30d: 20.0             # Min 30-day PnL %
  min_profitable_periods: 1            # Must be profitable in at least N periods

  # Swap monitoring
  swap_poll_interval_seconds: 60       # How often to check for new swaps
  min_swap_usd: 100.0                  # Ignore swaps below this USD value

  # Conviction alerts (wallet buys token already in our DB)
  conviction_enabled: true
  conviction_min_wallets: 1            # Min tracked wallets to trigger conviction
  conviction_score_bonus: 0.20         # Score bonus for conviction tokens

  # Rate limiting
  rate_limit_per_second: 15            # Standard API rate limit
  heavy_endpoint_delay: 1.1            # Delay for /swaps, /transfers (seconds)

# ── BaseScan Wallet Monitor ─────────────────────────────
# On-chain wallet monitoring via BaseScan API.
# Polls ERC-20 transfers for tracked wallets and detects
# buys from DEX routers. Independent of Arkham integration.
# Wallets loaded from data/smart_money_wallets.txt + wallets.txt.
wallet_monitor:
  enabled: true                                # Enable/disable wallet watch loop
  basescan_api_url: "https://api.basescan.org/api"
  basescan_api_key: null                       # Optional; or set BASESCAN_API_KEY env var
  wallet_file: "data/smart_money_wallets.txt"  # Machine-readable wallet list
  poll_interval_seconds: 60                    # How often to poll per wallet batch
  lookback_blocks: 150                         # ~5 minutes of Base blocks on first run
  min_usd_value: 50.0                          # Ignore transfers below this USD value
  weth_address: "0x4200000000000000000000000000000000000006"
  stable_addresses:                            # Outgoing stables = buy signal
    - "0x4200000000000000000000000000000000000006"  # WETH
    - "0x833589fcd6edb6e08f4c7c32d4f71b54bda02913"  # USDC
    - "0x6b175474e89094c44da98b954eedeac495271d0f"  # DAI
    - "0xd9aaec86b65d86f6a7b5b1b0c42ffa531710b6ca"  # USDbC
  conviction_score_bonus: 0.15                 # Score bonus for conviction tokens
  batch_size: 5                                # Wallets per API batch
  rate_delay_seconds: 0.25                     # Delay between API calls (rate limit)

# ── NansenBot Listener (Telethon) ───────────────────────
# Actively listens to @NansenBot using the Telegram client API.
# Requires a Telegram user account with api_id + api_hash from
# https://my.telegram.org.  The account must have an existing
# chat with @NansenBot.  First run requires interactive login.
nansen:
  enabled: true                                # Enable Telethon NansenBot listener
  api_id: null                                 # Telegram API ID (or NANSEN_API_ID env)
  api_hash: null                               # Telegram API hash (or NANSEN_API_HASH env)
  session_path: "data/nansen_session"          # Telethon session file path (no .session ext)
  bot_user_id: 1593218799                      # @NansenBot Telegram user ID
  forward_alerts: false                        # Forward parsed signals as alerts
  auto_add_wallets: true                       # Auto-add wallets to watchlist + DB
  base_only: true                              # Only process Base chain signals

# ── Champagne Evaluation Loop ───────────────────────────
# Re-evaluates champagne tokens that initially had no DEX data
# or scored below threshold. Champagne tokens (0.02% of all launches)
# have a 58% real-liquidity rate — worth retrying.
champagne_eval:
  enabled: true
  reeval_interval_seconds: 600         # Re-check every 10 minutes
  max_age_hours: 3                     # Stop retrying after 3 hours

# ── Paper Trading Simulator ─────────────────────────────
# Auto-enters simulated positions on every alert to measure
# real bot profitability without risking capital.
# Tracks SL/TP exits and generates nightly P&L reports.
paper_trading:
  enabled: true
  position_size_usd: 1000             # Simulated entry size per trade
  stop_loss_pct: -30                   # Exit at -30% loss
  tp1_pct: 50                          # Take 33% profit at +50%
  tp2_pct: 100                         # Take 33% profit at +100%
  tp3_pct: 300                         # Close remaining at +300%
  time_stop_hours: 24                  # Auto-close after 24 hours
  check_interval_seconds: 300          # Check positions every 5 minutes
  max_open_positions: 20               # Max concurrent open positions

# ── Multi-Wallet Conviction Engine ──────────────────────
# When 2+ tracked wallets buy the same token within a time window,
# fires a high-conviction alert. Also auto-ingests new tokens
# discovered via wallet buys if they have sufficient liquidity.
multi_conviction:
  enabled: true
  min_wallets: 2                       # Minimum distinct wallets to trigger
  window_hours: 6                      # Time window for overlap detection
  auto_ingest_from_wallet_buy: true    # Auto-add tokens from wallet buys
  auto_ingest_min_liq: 10000           # Min liquidity to auto-ingest ($)

telegram:
  bot_token: null          # or set TELEGRAM_BOT_TOKEN env var
  chat_id: null            # or set TELEGRAM_CHAT_ID env var
  disable_notification: false
  parse_mode: HTML

scraping:
  clanker_page_url: "https://www.clanker.world/clanker/{address}"
  ddg_search_template: "${symbol} bankrbot site:x.com"
  request_timeout_seconds: 15
  max_retries: 2

log_level: INFO
