# Clanker Token Tracker — example configuration
# Copy to config.yaml and fill in your values.
# Environment variables override: CLANKER_API_KEY, TELEGRAM_BOT_TOKEN,
# TELEGRAM_CHAT_ID, DATABASE_URL, BASE_RPC_WS

database:
  url: "sqlite+aiosqlite:///data/clanker_tracker.db"
  echo: false

clanker:
  base_url: "https://www.clanker.world/api"
  poll_interval_seconds: 30
  champagne_poll_interval_seconds: 120   # Curated champagne tokens scan
  api_key: null            # x-api-key for authenticated endpoints
  page_size: 50

bankr:
  deployer_addresses:
    # Add known Bankr deployer wallet addresses here (lowercase)
    # - "0x1234..."
  sdk_endpoint: null
  micropayment_amount_usd: 0.10

dexscreener:
  base_url: "https://api.dexscreener.com/latest/dex"
  rate_limit_per_minute: 60
  batch_size: 30             # Max addresses per batch request (DexScreener cap)

base_rpc:
  http_url: "https://mainnet.base.org"
  ws_url: null             # wss://... for real-time TokenCreated events

filtering:
  # ── Pre-filter (fast, before any API calls) ──────────
  skip_bankr: true                    # Reject Bankr bot launches instantly
  require_social_links: false         # Require at least one social link
  champagne_auto_pass_stage1: true    # Champagne tokens skip Stage 1

  # ── Stage 1: Instant reject gate ─────────────────────
  scam_keywords:
    - rug
    - scam
    - honeypot
    - honey pot
    - ponzi
    - fake
    - drain

  # ── Stage 2: DEX metrics thresholds ──────────────────
  min_pool_liquidity_usd: 500
  min_mcap_usd: 1000
  min_volume_5m_usd: 100
  min_holders: 5
  min_buy_sell_ratio: 0.3

  # ── Stage 3: Momentum detection ──────────────────────
  min_buys_1h: 10                     # Minimum buy txns in last hour
  price_surge_threshold_pct: 20       # % price jump = hot signal

  # ── Stage 4: Smart money ─────────────────────────────
  smart_money_wallet_file: "data/smart_money_wallets.txt"

  # ── Stage 5: Context quality ─────────────────────────
  require_origin_url: false

  # ── Scoring weights (must sum to ~1.0 ex. bonus) ─────
  weight_metrics: 0.30
  weight_momentum: 0.20
  weight_smart_money: 0.20
  weight_context: 0.15
  weight_champagne_bonus: 0.15        # Additive bonus for champagne tokens

  score_threshold: 0.45               # Minimum to trigger Telegram alert
  recheck_delay_seconds: 300          # Wait before DEX lookup (index time)

telegram:
  bot_token: null          # or set TELEGRAM_BOT_TOKEN env var
  chat_id: null            # or set TELEGRAM_CHAT_ID env var
  disable_notification: false
  parse_mode: HTML

scraping:
  clanker_page_url: "https://www.clanker.world/clanker/{address}"
  ddg_search_template: "${symbol} bankrbot site:x.com"
  request_timeout_seconds: 15
  max_retries: 2

log_level: INFO
